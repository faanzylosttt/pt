<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtusIM — Nomor Virtual & Layanan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#f4f6fb;--bg-2:#eef1f8;--surface:#ffffff;--surface-2:#f8fafc;--surface-3:#f1f5f9;
  --border:#e2e8f0;--border-2:#cbd5e1;--text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --primary:#4f46e5;--primary-2:#7c3aed;--primary-soft:#eef2ff;--primary-grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --success:#10b981;--success-soft:#ecfdf5;--warning:#f59e0b;--warning-soft:#fffbeb;
  --danger:#ef4444;--danger-soft:#fef2f2;--info:#3b82f6;--info-soft:#eff6ff;
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(15,23,42,.04);--sh:0 4px 12px rgba(15,23,42,.06);
  --sh-md:0 8px 24px rgba(15,23,42,.08);--sh-lg:0 16px 48px rgba(15,23,42,.12);
  --t:200ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0b1220;--bg-2:#0f172a;--surface:#111c2e;--surface-2:#152238;--surface-3:#1a2944;
  --border:#1e2d47;--border-2:#2a3d5c;--text:#e2e8f0;--text-2:#94a3b8;--muted:#64748b;
  --primary-soft:#1e1b4b;--success-soft:#052e22;--warning-soft:#3b2109;--danger-soft:#3f1316;--info-soft:#0c2a56;
  --sh-sm:0 1px 2px rgba(0,0,0,.3);--sh:0 4px 12px rgba(0,0,0,.35);--sh-md:0 8px 24px rgba(0,0,0,.4);--sh-lg:0 16px 48px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t)}
button,input,select,textarea{font-family:inherit;color:inherit}
.mono{font-family:'JetBrains Mono','Courier New',monospace}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.app{max-width:1440px;margin:0 auto;padding:16px}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:12px 18px;margin-bottom:14px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:16px;backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand-mark{
  width:42px;height:42px;border-radius:12px;background:var(--primary-grad);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;
  box-shadow:0 4px 12px rgba(79,70,229,.35);position:relative;overflow:hidden;
}
.brand-mark::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent)}
.brand-txt h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand-txt p{font-size:11px;color:var(--muted);font-weight:500}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
  transition:all var(--t);position:relative;color:var(--text-2);
}
.icon-btn:hover{background:var(--surface-3);border-color:var(--border-2);color:var(--text);transform:translateY(-1px)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--surface)}
.balance-pill{
  display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--primary-grad);
  border-radius:10px;color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(79,70,229,.25);
}
.balance-pill small{opacity:.85;font-weight:500;font-size:11px}

/* Sub-navigation */
.subnav{
  display:flex;gap:4px;margin-bottom:14px;padding:6px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sh-sm);
  scrollbar-width:none;
}
.subnav::-webkit-scrollbar{display:none}
.nav-item{
  padding:9px 14px;background:transparent;border:none;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:all var(--t);
  display:inline-flex;align-items:center;gap:6px;
}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}

/* Content */
.content{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:24px;box-shadow:var(--sh-sm);min-height:400px;
}
.view{display:none;animation:fadeIn 200ms ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ COMPONENTS ============ */
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card.plain{background:var(--surface)}
.card-elevated{background:var(--surface);box-shadow:var(--sh-sm)}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text)}
.card-title .spacer{margin-left:auto}
.card-subtitle{font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.6}

.btn{
  padding:10px 18px;border:none;border-radius:9px;font-size:13px;font-weight:600;
  cursor:pointer;transition:all var(--t);display:inline-flex;align-items:center;justify-content:center;
  gap:6px;white-space:nowrap;
}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--primary-grad);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,.4)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:7px}
.btn-block{width:100%}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-label .hint{color:var(--muted);font-weight:500;margin-left:4px}
.input,.select,.textarea{
  width:100%;padding:11px 14px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:9px;font-size:14px;transition:all var(--t);
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.textarea{resize:vertical;min-height:80px;font-family:inherit}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-secondary{background:var(--surface-3);color:var(--text-2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface-3);padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);font-weight:700;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-2)}

/* Alerts */
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;display:none;margin-bottom:12px;border-left:4px solid;line-height:1.5}
.alert.show{display:block;animation:fadeIn 200ms}
.alert-success{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.alert-error{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.alert-info{background:var(--info-soft);color:var(--info);border-color:var(--info)}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:10px;opacity:.4}
.empty-title{font-weight:600;color:var(--text-2);margin-bottom:4px}
.empty-desc{font-size:12px}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
.skel-line{height:14px;margin-bottom:8px}
.skel-line.w-60{width:60%}.skel-line.w-40{width:40%}.skel-line.w-80{width:80%}
.skel-card{height:110px;border-radius:12px}
.skel-row{display:flex;gap:12px;margin-bottom:12px;align-items:center}
.skel-avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Toast */
.toast-stack{position:fixed;top:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:10px;max-width:360px;pointer-events:none}
.toast{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--info);
  padding:12px 14px;border-radius:10px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:500;transform:translateX(400px);opacity:0;transition:all 300ms cubic-bezier(.4,0,.2,1);
  pointer-events:auto;
}
.toast.show{transform:translateX(0);opacity:1}
.toast-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.toast-success{border-left-color:var(--success)}.toast-success .toast-icon{background:var(--success)}
.toast-error{border-left-color:var(--danger)}.toast-error .toast-icon{background:var(--danger)}
.toast-warning{border-left-color:var(--warning)}.toast-warning .toast-icon{background:var(--warning)}
.toast-info{border-left-color:var(--info)}.toast-info .toast-icon{background:var(--info)}
.toast-msg{flex:1;line-height:1.4}
.toast-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
.toast-close:hover{color:var(--text)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn 200ms}
.modal.show{display:flex}
.modal-box{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:modalIn 250ms cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:16px;font-weight:700}
.modal-close{background:var(--surface-3);border:none;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.modal-close:hover{background:var(--border);color:var(--text)}
.modal-body{padding:24px}

/* Command palette */
.cmd-palette{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(6px);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;animation:fadeIn 150ms}
.cmd-palette.show{display:flex}
.cmd-box{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:var(--sh-lg);overflow:hidden;animation:modalIn 200ms}
.cmd-search{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.cmd-search input{flex:1;border:none;background:transparent;font-size:15px;outline:none;color:var(--text)}
.cmd-search kbd{padding:3px 6px;background:var(--surface-3);border-radius:5px;font-size:10px;font-weight:700;color:var(--text-2);border:1px solid var(--border);font-family:'JetBrains Mono',monospace}
.cmd-results{max-height:400px;overflow-y:auto;padding:8px}
.cmd-item{padding:10px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;transition:background 100ms}
.cmd-item:hover,.cmd-item.hl{background:var(--primary-soft);color:var(--primary)}
.cmd-item span:first-child{font-size:16px}
.cmd-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

/* ============ SERVICE / COUNTRY CARDS ============ */
.svc-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all var(--t);position:relative;overflow:hidden}
.svc-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--sh)}
.svc-card.selected{border-color:var(--primary);background:var(--primary-soft)}
.svc-card.selected::after{content:"✓";position:absolute;top:8px;right:8px;width:18px;height:18px;background:var(--primary);color:#fff;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
.svc-icon{width:44px;height:44px;border-radius:11px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:20px}
.svc-name{font-size:12px;font-weight:600;line-height:1.3}

.ctr-card{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:14px;cursor:pointer;transition:all var(--t)}
.ctr-card:hover{border-color:var(--primary)}
.ctr-card.selected{border-color:var(--primary);background:var(--primary-soft)}
.ctr-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctr-name{font-weight:600;font-size:13px}
.ctr-meta{font-size:11px;color:var(--muted);margin-top:3px}
.ctr-price{font-weight:800;color:var(--primary);font-size:13px;text-align:right}
.ctr-stock{font-size:10px;color:var(--success);margin-top:3px;text-align:right}

/* ============ SEARCH ============ */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--surface);transition:all var(--t)}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);font-weight:700}

/* ============ OTP ============ */
.otp-big{background:var(--primary-grad);color:#fff;padding:18px;border-radius:12px;text-align:center;font-size:30px;font-weight:800;letter-spacing:8px;margin:12px 0;font-family:'JetBrains Mono',monospace;position:relative;overflow:hidden}
.otp-big::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent)}
.num-display{background:var(--surface);border:2px dashed var(--primary);padding:14px;border-radius:11px;text-align:center;font-size:20px;font-weight:800;color:var(--primary);margin:12px 0;font-family:'JetBrains Mono',monospace}

/* ============ DEPOSIT ============ */
.dep-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
@media(max-width:900px){.dep-grid{grid-template-columns:1fr}}

.dep-form{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;height:fit-content}
.preset-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.preset{padding:11px 6px;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--text);transition:all var(--t)}
.preset:hover{border-color:var(--primary);color:var(--primary)}
.preset.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(79,70,229,.25)}

.method-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:2px}
.method{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all var(--t);display:flex;justify-content:space-between;align-items:center;gap:10px}
.method:hover{border-color:var(--primary)}
.method.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.method-name{font-weight:600;font-size:13px}
.method-meta{font-size:11px;color:var(--muted);margin-top:2px}
.method-fee{font-size:11px;color:var(--success);font-weight:700;flex-shrink:0;padding:3px 8px;background:var(--success-soft);border-radius:6px}

.dep-result{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.dep-steps{display:flex;gap:4px;margin-bottom:18px}
.dep-step{flex:1;text-align:center;position:relative;padding:8px 4px;font-size:11px;font-weight:600;color:var(--muted);border-radius:6px;background:var(--surface-3);transition:all var(--t)}
.dep-step.done{background:var(--success-soft);color:var(--success)}
.dep-step.current{background:var(--primary);color:#fff}

.qr-box{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:18px;text-align:center;margin:14px 0}
.qr-box img{max-width:280px;width:100%;border-radius:8px;display:block;margin:0 auto}
.qr-ph{width:280px;height:280px;background:var(--surface-3);border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:20px;margin:0 auto}
.qr-label{font-size:11px;color:var(--muted);margin-top:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.qr-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--warning-soft);color:var(--warning);border-radius:99px;font-size:10px;font-weight:700;margin-top:6px}
.qr-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}

.dep-total{font-size:26px;font-weight:800;text-align:center;color:var(--primary);font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;margin:4px 0 12px}
.pay-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px}
.pay-line:last-child{border-bottom:none}
.pay-line .lbl{color:var(--text-2);font-weight:500;flex-shrink:0}
.pay-line .val{font-weight:700;display:flex;align-items:center;gap:6px;text-align:right;min-width:0;word-break:break-all;justify-content:flex-end;font-family:'JetBrains Mono',monospace;font-size:12px}
.copy-btn{padding:3px 8px;background:var(--primary-soft);color:var(--primary);border:none;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;transition:all var(--t);flex-shrink:0}
.copy-btn:hover{background:var(--primary);color:#fff}

.countdown{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--warning-soft);color:var(--warning);border-radius:8px;font-weight:700;font-size:13px;border:1px solid rgba(245,158,11,.3);font-family:'JetBrains Mono',monospace}
.countdown.exp{background:var(--danger-soft);color:var(--danger);border-color:rgba(239,68,68,.3)}
.countdown.success{background:var(--success-soft);color:var(--success);border-color:rgba(16,185,129,.3)}

.dep-hint{background:var(--info-soft);border:1px solid rgba(59,130,246,.25);color:var(--info);border-radius:9px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:14px}
.dep-hint strong{display:block;margin-bottom:3px}

/* Notification panel */
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-lg);padding:0;display:none;z-index:60;max-height:400px;overflow:hidden}
.notif-panel.show{display:block;animation:fadeIn 150ms}
.notif-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.notif-list{max-height:340px;overflow-y:auto}

<script>
'use strict';
/* =====================================================
   UTILITIES
===================================================== */
const $ = id => document.getElementById(id);
const qs = (sel, ctx = document) => ctx.querySelector(sel);
const qsa = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const rp = n => 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }));
const delay = ms => new Promise(r => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* =====================================================
   STORE — reactive state
===================================================== */
const Store = (() => {
  const state = {};
  const subs = new Map();
  return {
    get: k => state[k],
    set(k, v) {
      const prev = state[k];
      state[k] = v;
      (subs.get(k) || []).forEach(fn => { try { fn(v, prev); } catch (e) { console.error(e); } });
    },
    subscribe(k, fn) {
      if (!subs.has(k)) subs.set(k, []);
      subs.get(k).push(fn);
      return () => subs.set(k, (subs.get(k) || []).filter(f => f !== fn));
    }
  };
})();

/* =====================================================
   TOAST STACK
===================================================== */
const Toast = {
  container: null,
  init() { this.container = $('toastStack'); },
  show(msg, opts = {}) {
    const { type = 'info', duration = 4000 } = opts;
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span class="toast-icon">${this.icon(type)}</span><span class="toast-msg">${esc(msg)}</span><button class="toast-close">×</button>`;
    el.querySelector('.toast-close').onclick = () => this.dismiss(el);
    this.container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    if (duration > 0) setTimeout(() => this.dismiss(el), duration);
  },
  dismiss(el) {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  },
  icon(type) {
    return { success: '✓', error: '✕', warning: '!', info: 'i' }[type] || 'i';
  }
};

/* =====================================================
   NOTIFICATION CENTER
===================================================== */
const Notification = (() => {
  const items = JSON.parse(localStorage.getItem('notifs') || '[]');
  const MAX = 30;
  function save() { localStorage.setItem('notifs', JSON.stringify(items.slice(0, MAX))); }
  function render() {
    const list = $('notifList');
    if (!list) return;
    if (!items.length) {
      list.innerHTML = `<div style="padding:40px 16px;text-align:center;color:var(--muted);font-size:12px"><div style="font-size:32px;opacity:.3;margin-bottom:6px">🔔</div>Belum ada notifikasi</div>`;
    } else {
      list.innerHTML = items.map(n => `<div class="notif-item"><b>${esc(n.title)}</b>${esc(n.body)}<br><span>${new Date(n.time).toLocaleString('id-ID')}</span></div>`).join('');
    }
    $('notifDot').style.display = items.length ? 'block' : 'none';
  }
  return {
    push(title, body) {
      items.unshift({ title, body, time: Date.now() });
      save(); render();
    },
    clear() { items.length = 0; save(); render(); },
    render,
    init() {
      render();
      $('notifBtn').onclick = e => {
        e.stopPropagation();
        $('notifPanel').classList.toggle('show');
      };
      document.addEventListener('click', e => {
        if (!$('notifPanel').contains(e.target) && !$('notifBtn').contains(e.target)) {
          $('notifPanel').classList.remove('show');
        }
      });
    }
  };
})();

/* =====================================================
   THEME
===================================================== */
const Theme = {
  init() {
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    $('themeToggle').onclick = () => this.toggle();
  },
  toggle() {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
    Toast.show('Mode ' + (next === 'dark' ? 'gelap' : 'terang') + ' aktif', { type: 'info', duration: 1500 });
  }
};

/* =====================================================
   API CLIENT — retry, dedupe, cache, abort
===================================================== */
class API {
  constructor(baseURL, apiKey) {
    this.base = baseURL;
    this.key = apiKey;
    this.cache = new Map();
    this.inflight = new Map();
  }
  async call(path, { method = 'GET', body, retries = 2, timeout = 20000, cache = false } = {}) {
    const cacheKey = method + ':' + path + (body ? ':' + JSON.stringify(body) : '');
    if (this.inflight.has(cacheKey)) return this.inflight.get(cacheKey);
    if (method === 'GET' && cache) {
      const c = this.cache.get(cacheKey);
      if (c && Date.now() - c.t < 60000) return c.data;
    }
    const promise = this._fetch(path, { method, body, retries, timeout });
    this.inflight.set(cacheKey, promise);
    try {
      const result = await promise;
      if (method === 'GET' && cache) this.cache.set(cacheKey, { data: result, t: Date.now() });
      return result;
    } finally { this.inflight.delete(cacheKey); }
  }
  async _fetch(path, { method, body, retries, timeout }) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    const opts = { method, headers: { 'X-API-Key': this.key }, signal: ctrl.signal };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    if (method === 'POST') opts.headers['Idempotency-Key'] = uid();
    try {
      const res = await fetch(this.base + path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) throw new Error(data.message || `HTTP ${res.status}`);
      return data;
    } catch (err) {
      if (retries > 0 && err.name !== 'AbortError') {
        await delay(1000);
        return this._fetch(path, { method, body, retries: retries - 1, timeout });
      }
      throw err;
    } finally { clearTimeout(timer); }
  }
  invalidateCache() { this.cache.clear(); }
}

const api = new API('https://virtusimotp.com/api/v1', 'vcoBYGVHKtLfaW1f3DnVsRDZ5aZk1NQd');

/* =====================================================
   POLLER — centralized, visibility-aware
===================================================== */
const Poller = {
  jobs: new Map(),
  add(id, fn, interval) {
    this.remove(id);
    const job = { fn, interval, timer: null };
    this.jobs.set(id, job);
    this._start(job);
  },
  remove(id) {
    const j = this.jobs.get(id);
    if (j) { clearInterval(j.timer); this.jobs.delete(id); }
  },
  removeAll(prefix) {
    [...this.jobs.keys()].forEach(k => { if (k.startsWith(prefix)) this.remove(k); });
  },
  _start(job) { job.fn(); job.timer = setInterval(job.fn, job.interval); },
  _pauseAll() { this.jobs.forEach(j => clearInterval(j.timer)); },
  _resumeAll() { this.jobs.forEach(j => { clearInterval(j.timer); j.timer = setInterval(j.fn, j.interval); }); },
  init() {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this._pauseAll();
      else this._resumeAll();
    });
  }
};

/* =====================================================
   MODAL
===================================================== */
const Modal = {
  open(id) { $(id).classList.add('show'); },
  close(id) { $(id).classList.remove('show'); },
  init() {
    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal')) e.target.classList.remove('show');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') qsa('.modal.show').forEach(m => m.classList.remove('show'));
    });
  }
};

/* =====================================================
   CLIPBOARD
===================================================== */
async function copy(text) {
  if (!text) return;
  try {
    await navigator.clipboard.writeText(String(text));
    Toast.show('Disalin: ' + text, { type: 'success', duration: 1800 });
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    Toast.show('Disalin: ' + text, { type: 'success', duration: 1800 });
  }
}

/* =====================================================
   ROUTER
===================================================== */
const Router = {
  routes: {},
  current: null,
  register(name, fn) { this.routes[name] = fn; },
  go(path) { location.hash = '#/' + path; },
  init() {
    window.addEventListener('hashchange', () => this.handle());
    this.handle();
  },
  handle() {
    const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const [route, ...params] = raw.split('/');
    const viewName = this.routes[route] ? route : 'dashboard';
    this.current = viewName;

    qsa('.view').forEach(v => v.classList.remove('active'));
    const el = $('view-' + viewName);
    if (el) el.classList.add('active');

    qsa('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === viewName));

    try { this.routes[viewName]?.(params); }
    catch (e) { console.error('Route error:', e); Toast.show('Gagal memuat halaman', { type: 'error' }); }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

/* =====================================================
   COMMAND PALETTE
===================================================== */
const Cmd = {
  open: false,
  commands: [],
  init() {
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); this.toggle();
      }
      if (e.key === 'Escape' && this.open) this.close();
    });
    $('cmdPalette').onclick = e => { if (e.target.id === 'cmdPalette') this.close(); };
    $('cmdInput').addEventListener('input', () => this.render());
    $('cmdInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const first = qs('.cmd-item', $('cmdResults'));
        if (first) first.click();
      }
    });
    this.registerDefaults();
  },
  registerDefaults() {
    const nav = [
      ['Dashboard', 'dashboard', '📊'], ['Beli Nomor', 'buyNumber', '📱'],
      ['Order Aktif', 'activeOrders', '⏳'], ['Riwayat', 'history', '📜'],
      ['Gmail', 'gmail', '📧'], ['Rental Email', 'emailRental', '📮'],
      ['WA Ready', 'waReady', '💬'], ['SMM', 'smm', '📈'],
      ['Refund', 'refund', '💸'], ['Deposit', 'deposit', '💳']
    ];
    this.commands = nav.map(([name, path, icon]) => ({ name, icon, action: () => Router.go(path) }));
    this.commands.push({ name: 'Toggle Dark Mode', icon: '🌓', action: () => Theme.toggle() });
    this.commands.push({ name: 'Refresh Saldo', icon: '🔄', action: () => loadBalance(true) });
    this.commands.push({ name: 'Refresh Semua', icon: '🔁', action: () => refreshAll() });
  },
  toggle() { this.open ? this.close() : this.show(); },
  show() { this.open = true; $('cmdPalette').classList.add('show'); $('cmdInput').value = ''; this.render(); setTimeout(() => $('cmdInput').focus(), 50); },
  close() { this.open = false; $('cmdPalette').classList.remove('show'); },
  render() {
    const q = $('cmdInput').value.toLowerCase();
    const filtered = this.commands.filter(c => c.name.toLowerCase().includes(q));
    $('cmdResults').innerHTML = filtered.length
      ? filtered.map((c, i) => `<div class="cmd-item" data-i="${i}"><span>${c.icon}</span><span>${esc(c.name)}</span></div>`).join('')
      : '<div class="cmd-empty">Tidak ada hasil untuk "' + esc(q) + '"</div>';
    qsa('.cmd-item', $('cmdResults')).forEach((el, i) => {
      el.onclick = () => { filtered[i].action(); this.close(); };
    });
  }
};

/* =====================================================
   GLOBAL ERROR BOUNDARY
===================================================== */
window.addEventListener('error', e => console.error('[Global]', e.error || e.message));
window.addEventListener('unhandledrejection', e => {
  console.error('[Unhandled]', e.reason);
  const msg = e.reason?.message || 'Terjadi kesalahan';

});

  } catch (e) {
    if (toastIfForced) Toast.show('Gagal refresh saldo', { type: 'error' });
  }
}

async function loadProfile() {
  try {
    const r = await api.call('/profile');
    const s = r.data?.stats || {};
    Store.set('stats', s);
    const e1 = $('statOrders'); if (e1) e1.textContent = s.total_orders ?? '0';
    const e2 = $('statSMS'); if (e2) e2.textContent = s.total_sms ?? '0';
  } catch (e) { /* silent */ }
}

async function refreshAll() {
  Toast.show('Menyegarkan data...', { type: 'info', duration: 1200 });
  await loadBalance();
  await loadProfile();
  Router.handle();

function svcIcon(name) {
  const map = { whatsapp: '💬', telegram: '✈️', google: '🔍', gmail: '📧', facebook: '📘', instagram: '📷', twitter: '🐦', tiktok: '🎵', youtube: '📺', discord: '🎮', netflix: '🎬', shopee: '🛍️', tokopedia: '🛒', grab: '🚖', gojek: '🛵' };
  const l = (name || '').toLowerCase();
  for (const k in map) if (l.includes(k)) return map[k];
  return '📱';
}

function renderServices(list) {
  const g = $('svcGrid'); if (!g) return;
  g.innerHTML = list.length ? list.map(s => `

async function buyNumber() {
  if (!selectedService || !selectedCountry) return Toast.show('Pilih layanan & negara', { type: 'warning' });
  const qty = parseInt($('qty').value) || 1;
  if (qty < 1 || qty > 30) return Toast.show('Jumlah 1–30', { type: 'warning' });
  try {
    Toast.show('Memproses pembelian...', { type: 'info', duration: 1500 });
    const r = await api.call('/orders', { method: 'POST', body: { service_id: selectedService.id, country: selectedCountry.id, quantity: qty } });
    Toast.show('✅ Pembelian berhasil', { type: 'success' });
    Notification.push('Pembelian berhasil', `${selectedService.name} · ${selectedCountry.name} × ${qty}`);
    renderOrderResult(r);
    loadBalance();
    const uuids = [];
    if (r.order?.order_uuid) uuids.push(r.order.order_uuid);
    (r.data?.results || []).forEach(x => x.order_uuid && uuids.push(x.order_uuid));

}

function pollOrder(uuid) {
  Poller.add('order:' + uuid, async () => {
    try {
      const r = await api.call(`/orders/${uuid}`);
      const o = r.data || {};
      const t = $('timer-' + uuid); if (t) t.textContent = (o.remaining_time || 0) + 's';
      if (o.latest_code) {
        Poller.remove('order:' + uuid);
        const box = $('otp-' + uuid);
        if (box) box.innerHTML = `<div class="otp-big">${esc(o.latest_code)}</div><div style="text-align:center;color:var(--success);font-weight:700;font-size:12px">✅ Kode diterima</div>`;
        showOtpModal(o);
        Notification.push('Kode OTP diterima', `${o.number} → ${o.latest_code}`);
        Toast.show('🔔 OTP: ' + o.latest_code, { type: 'success', duration: 8000 });
      }
      if (o.is_expired) Poller.remove('order:' + uuid);
    } catch (e) { /* silent */ }
  }, 5000);
}

function showOtpModal(o) {
  $('otpModalBody').innerHTML = `

}

async function cancelOrder(uuid) {

function buildQrImg(d) {
  // Priority chain for QR sources
  if (d.qr_code_base64) {
    let b64 = String(d.qr_code_base64).trim();
    if (!b64.startsWith('data:image')) b64 = 'data:image/png;base64,' + b64.replace(/^data:image\/[a-z]+;base64,/, '');
    return `<img src="${b64}" alt="QRIS">`;
  }
  if (d.qr_url) return `<img src="${esc(d.qr_url)}" alt="QRIS">`;
  if (d.qr_string) return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(d.qr_string)}" alt="QRIS">`;
  if (d.qr_code) {
    const s = String(d.qr_code);
    if (s.startsWith('http')) return `<img src="${esc(s)}" alt="QRIS">`;
    if (s.length > 50 && /^[A-Za-z0-9+/=]+$/.test(s)) return `<img src="data:image/png;base64,${s}" alt="QRIS">`;
    return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(s)}" alt="QRIS">`;
  }
  return null;
}

function startCountdown(d) {
  clearInterval(depositTimer);
  const el = $('depCountdown'); if (!el) return;

  let expiry = 0;
  const iso = d.expires_at_iso || d.expires_at;
  if (iso) { const p = Date.parse(iso.replace(' ', 'T')); if (!isNaN(p)) expiry = p; }
  if (!expiry && d.expiration_time) expiry = Date.now() + parseInt(d.expiration_time) * 60000;
  if (!expiry && d.expires_in_seconds) expiry = Date.now() + parseInt(d.expires_in_seconds) * 1000;

  if (!expiry) { el.textContent = '⏱️ Tanpa batas'; return; }

  const tick = () => {
    const diff = expiry - Date.now();
    if (diff <= 0) {
      el.textContent = '⏱️ Kedaluwarsa';
      el.classList.add('exp');
      clearInterval(depositTimer);
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = `⏱️ ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    if (diff < 5 * 60000) el.classList.add('exp');
    else el.classList.remove('exp');
  };
  tick();
  depositTimer = setInterval(tick, 1000);
}

function startDepositPolling(d) {
  if (!d.uniqcode_tx) return;
  Poller.remove('deposit');
  Poller.add('deposit', async () => {
    try {
      const r = await api.call(`/transactions/${d.uniqcode_tx}`);
      const st = (r.data?.status || '').toLowerCase();
      if (st === 'success') {
        Poller.remove('deposit');
        clearInterval(depositTimer);
        const cd = $('depCountdown');
        if (cd) { cd.textContent = '✅ Pembayaran Diterima'; cd.classList.add('success'); cd.classList.remove('exp'); }
        const badge = $('depStatusBadge');
        if (badge) { badge.className = 'badge badge-success spacer'; badge.textContent = 'SUCCESS'; }
        $('step2')?.classList.remove('current'); $('step2')?.classList.add('done');
        $('step3')?.classList.add('done');
        Toast.show('💰 Deposit berhasil! Saldo ditambahkan', { type: 'success', duration: 6000 });
        Notification.push('Deposit berhasil', `+ ${rp(d.total_amount || d.amount)}`);
        playSound();
        loadBalance(); loadTx();
      } else if (st === 'failed' || st === 'expired') {
        Poller.remove('deposit');
        clearInterval(depositTimer);
        Toast.show('❌ Pembayaran ' + st, { type: 'error' });
      }
    } catch (e) { /* silent */ }
  }, 8000);
}

function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
      osc.start(ctx.currentTime + i * 0.1);
      osc.stop(ctx.currentTime + i * 0.1 + 0.3);
    });
  } catch (e) { /* silent */ }
}

async function createCrypto() {
  const val = parseFloat(prompt('Jumlah deposit USD (1–10.000):', '10'));
  if (isNaN(val) || val < 1 || val > 10000) return Toast.show('Nominal tidak valid', { type: 'warning' });
  try {
    const r = await api.call('/deposits/crypto', { method: 'POST', body: { amount: val } });
    if (r.data?.checkout_url) { window.open(r.data.checkout_url, '_blank'); Toast.show('✅ Checkout dibuka', { type: 'success' }); }
  } catch (e) { Toast.show(e.message, { type: 'error' }); }
}

async function loadTx() {
  const box = $('txList'); if (!box) return;
  try {
    const r = await api.call('/transactions');
    const list = r.data?.transactions || [];
    box.innerHTML = list.length ? `
      <table>
        <thead><tr><th>Kode</th><th>Jumlah</th><th>Status</th><th>Metode</th><th>Waktu</th></tr></thead>
        <tbody>${list.map(t => `
          <tr>
            <td class="mono" style="font-size:10px">${esc(t.uniqcode_tx)}</td>
            <td><b>${rp(t.total_amount)}</b></td>
            <td><span class="badge badge-${t.status === 'success' ? 'success' : t.status === 'pending' ? 'warning' : 'danger'}">${esc(t.status)}</span></td>
            <td style="font-size:11px">${esc(t.payment_method?.name || '-')}</td>
            <td style="font-size:11px;color:var(--muted)">${esc(t.created_at_iso || '-')}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty"><div class="empty-title">Belum ada transaksi</div></div>`;
  } catch (e) { box.innerHTML = `<div class="empty"><div class="empty-title">Gagal memuat</div></div>`; }
}
