<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-title" content="ZyanOTPs">
<title>ZyanOTPs — Cyber OTP Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f;--bg-2:#0a0f1a;--surface:#0f1524;--surface-2:#131b2e;--surface-3:#1a2540;
  --border:#1e2d4a;--border-2:#2a3d5e;--text:#e6ebf5;--text-2:#8fa0bd;--muted:#5a6b85;
  --primary:#00e5ff;--primary-2:#b14aed;--primary-soft:rgba(0,229,255,.08);--primary-grad:linear-gradient(135deg,#00e5ff 0%,#b14aed 100%);
  --success:#00ff88;--success-soft:rgba(0,255,136,.1);--warning:#ffb300;--warning-soft:rgba(255,179,0,.1);
  --danger:#ff2d92;--danger-soft:rgba(255,45,146,.1);--info:#00e5ff;--info-soft:rgba(0,229,255,.1);
  --r-sm:6px;--r:10px;--r-lg:14px;
  --sh-sm:0 1px 3px rgba(0,0,0,.5);--sh:0 4px 16px rgba(0,0,0,.6);--sh-md:0 8px 32px rgba(0,0,0,.7);--sh-lg:0 16px 64px rgba(0,0,0,.8);
  --glow:0 0 20px rgba(0,229,255,.4);--glow-lg:0 0 40px rgba(0,229,255,.5);
  --t:200ms cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#eef2f9;--bg-2:#e4eaf5;--surface:#fff;--surface-2:#f6f8fc;--surface-3:#eaf0f9;
  --border:#d0d9e8;--border-2:#b8c4d8;--text:#0a1525;--text-2:#475569;--muted:#8896ab;
  --primary:#0085cc;--primary-2:#7b3fd4;--primary-soft:rgba(0,133,204,.08);--primary-grad:linear-gradient(135deg,#0085cc 0%,#7b3fd4 100%);
  --success:#00a35a;--success-soft:rgba(0,163,90,.1);--warning:#d97706;--warning-soft:rgba(217,119,6,.1);
  --danger:#dc2654;--danger-soft:rgba(220,38,84,.1);--info:#0085cc;--info-soft:rgba(0,133,204,.1);
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Rajdhani','Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;animation:gridMove 60s linear infinite}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:40px 40px}}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(0,229,255,.06) 0%,transparent 50%),radial-gradient(ellipse at bottom,rgba(177,74,237,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
button,input,select,textarea{font-family:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.icon{display:inline-block;vertical-align:middle;flex-shrink:0;stroke:currentColor;fill:none}
::selection{background:var(--primary);color:#000}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

.app{max-width:1440px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* TOP PROGRESS */
.top-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;opacity:0;transition:opacity 200ms}
.top-progress.active{opacity:1}
.top-progress .tp-bar{height:100%;width:0;background:var(--primary-grad);box-shadow:0 0 12px var(--primary);transition:width 300ms ease}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,21,36,.85);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 18px;margin-bottom:14px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;backdrop-filter:blur(20px);position:relative}
.topbar::before,.topbar::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--primary);pointer-events:none}
.topbar::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-top-left-radius:var(--r-lg)}
.topbar::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-bottom-right-radius:var(--r-lg)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;cursor:pointer}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--primary-grad);display:flex;align-items:center;justify-content:center;color:#000;box-shadow:0 0 20px rgba(0,229,255,.5);position:relative;overflow:hidden;flex-shrink:0}
.brand-mark::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.15) 50%,transparent 50%,rgba(0,0,0,.15) 100%);background-size:100% 4px;animation:scan 2s linear infinite}
@keyframes scan{0%{background-position:0 0}100%{background-position:0 8px}}
.brand-mark .icon{position:relative;z-index:1}
.brand-txt h1{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:800;letter-spacing:.05em;background:var(--primary-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-txt p{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);position:relative;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-3);border-color:var(--primary);color:var(--primary);box-shadow:0 0 12px rgba(0,229,255,.4);transform:translateY(-1px)}
.icon-btn .badge-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--danger);color:#fff;border-radius:99px;border:2px solid var(--surface);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'Orbitron',sans-serif;box-shadow:0 0 10px var(--danger)}
.live-clock{font-size:12px;color:var(--primary);font-weight:700;padding:8px 12px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3);border-radius:8px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;text-shadow:0 0 10px rgba(0,229,255,.5)}
.balance-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--primary-grad);border-radius:8px;color:#000;font-weight:800;font-size:13px;cursor:pointer;transition:all var(--t);font-family:'Orbitron',sans-serif;letter-spacing:.02em;box-shadow:0 0 20px rgba(0,229,255,.4)}
.balance-pill:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(0,229,255,.6)}
.balance-pill .icon{stroke-width:2.5}
.conn-offline{display:none;align-items:center;gap:6px;padding:6px 12px;background:var(--danger-soft);color:var(--danger);border-radius:8px;font-size:11px;font-weight:700;border:1px solid rgba(255,45,146,.3);font-family:'Orbitron',sans-serif}
.conn-offline.show{display:inline-flex}

/* SUBNAV */
.subnav{display:flex;gap:4px;margin-bottom:14px;padding:6px;background:rgba(15,21,36,.85);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sh-sm);scrollbar-width:none;backdrop-filter:blur(20px)}
.subnav::-webkit-scrollbar{display:none}
.nav-item{padding:9px 14px;background:transparent;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;color:var(--text-2);white-space:nowrap;transition:all var(--t);display:inline-flex;align-items:center;gap:7px;font-family:'Rajdhani',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.nav-item:hover{background:var(--surface-3);color:var(--primary)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary);box-shadow:0 0 15px rgba(0,229,255,.3),inset 0 0 10px rgba(0,229,255,.1)}

/* CONTENT */
.content{background:rgba(15,21,36,.7);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;box-shadow:var(--sh-sm);min-height:400px;position:relative;backdrop-filter:blur(10px)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:16px;font-weight:700;font-family:'Orbitron',sans-serif;letter-spacing:.05em;text-transform:uppercase}
.breadcrumb .cur{color:var(--primary);font-weight:800;display:flex;align-items:center;gap:6px;text-shadow:0 0 10px rgba(0,229,255,.5)}
.view{display:none;animation:fadeIn 200ms ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* CARD */
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;position:relative}
.card.plain{background:var(--surface)}
.card::before{content:"";position:absolute;top:-1px;left:12px;width:24px;height:2px;background:var(--primary);box-shadow:0 0 8px var(--primary)}
.card-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text);letter-spacing:.03em;text-transform:uppercase}
.card-title .icon{color:var(--primary);filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
.card-title .spacer{margin-left:auto}
.card-subtitle{font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.6;font-weight:500}

/* BUTTON */
.btn{padding:10px 18px;border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all var(--t);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-family:'Orbitron',sans-serif;letter-spacing:.05em;text-transform:uppercase;position:relative}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary{background:var(--primary-grad);color:#000;box-shadow:0 0 20px rgba(0,229,255,.3)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 30px rgba(0,229,255,.6)}
.btn-success{background:rgba(0,255,136,.15);color:var(--success);border-color:var(--success)}
.btn-success:hover{background:rgba(0,255,136,.25);box-shadow:0 0 20px rgba(0,255,136,.4)}
.btn-danger{background:rgba(255,45,146,.15);color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:rgba(255,45,146,.25);box-shadow:0 0 20px rgba(255,45,146,.4)}
.btn-warning{background:rgba(255,179,0,.15);color:var(--warning);border-color:var(--warning)}
.btn-warning:hover{background:rgba(255,179,0,.25);box-shadow:0 0 20px rgba(255,179,0,.4)}
.btn-secondary{background:var(--surface-3);color:var(--text);border-color:var(--border-2)}
.btn-secondary:hover{background:var(--border);border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:10px;border-radius:6px;gap:4px}
.btn-block{width:100%}
.btn-ghost{background:transparent;color:var(--text-2);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-3);color:var(--primary);border-color:var(--primary)}

/* FORM */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-family:'Orbitron',sans-serif}
.input,.select,.textarea{width:100%;padding:11px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;font-size:13px;transition:all var(--t);font-family:'Rajdhani',sans-serif;font-weight:600}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,229,255,.15),0 0 15px rgba(0,229,255,.3)}
.textarea{resize:vertical;min-height:60px;font-family:'JetBrains Mono',monospace;font-size:12px}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-family:'Orbitron',sans-serif}
.badge-success{background:var(--success-soft);color:var(--success);border:1px solid var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info);border:1px solid var(--info)}
.badge-secondary{background:var(--surface-3);color:var(--text-2);border:1px solid var(--border)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface-3);padding:10px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);font-weight:800;border-bottom:1px solid var(--primary);cursor:pointer;user-select:none;font-family:'Orbitron',sans-serif}
th:hover{color:var(--text)}
th .sort-arrow{display:inline-block;margin-left:4px;opacity:.5;font-size:9px}
th.sorted .sort-arrow{opacity:1}
td{padding:12px;border-bottom:1px solid var(--border);font-weight:600}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--primary-soft)}

/* ALERTS */
.alert{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;display:none;margin-bottom:12px;border-left:3px solid;line-height:1.5;align-items:flex-start;gap:10px}
.alert.show{display:flex;animation:fadeIn 200ms}
.alert .icon{flex-shrink:0;margin-top:1px}
.alert-success{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.alert-error{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.alert-info{background:var(--info-soft);color:var(--info);border-color:var(--info)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{display:inline-flex;width:56px;height:56px;border-radius:14px;background:var(--surface-3);align-items:center;justify-content:center;margin-bottom:12px;color:var(--primary);border:1px solid var(--border);box-shadow:0 0 20px rgba(0,229,255,.1)}
.empty-title{font-weight:700;color:var(--text-2);margin-bottom:4px;font-size:13px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.empty-desc{font-size:12px}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
.skel-line{height:14px;margin-bottom:8px}
.skel-line.w-40{width:40%}.skel-line.w-80{width:80%}
.skel-card{height:90px;border-radius:12px}
.skel-row{display:flex;gap:12px;margin-bottom:12px;align-items:center}
.skel-avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* TOAST */
.toast-stack{position:fixed;top:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:10px;max-width:380px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--info);padding:12px 14px 14px;border-radius:8px;box-shadow:var(--sh-lg);display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:600;transform:translateX(400px);opacity:0;transition:all 300ms cubic-bezier(.4,0,.2,1);pointer-events:auto;position:relative;overflow:hidden;backdrop-filter:blur(20px)}
.toast.show{transform:translateX(0);opacity:1}
.toast::after{content:"";position:absolute;bottom:0;left:0;height:3px;background:currentColor;width:100%;animation:toastBar linear forwards;animation-duration:var(--dur,4s)}
@keyframes toastBar{from{width:100%}to{width:0}}
.toast-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#000}
.toast-success{border-left-color:var(--success);color:var(--success)}.toast-success .toast-icon{background:var(--success);box-shadow:0 0 15px var(--success)}
.toast-error{border-left-color:var(--danger);color:var(--danger)}.toast-error .toast-icon{background:var(--danger);box-shadow:0 0 15px var(--danger)}
.toast-warning{border-left-color:var(--warning);color:var(--warning)}.toast-warning .toast-icon{background:var(--warning);box-shadow:0 0 15px var(--warning)}
.toast-info{border-left-color:var(--info);color:var(--info)}.toast-info .toast-icon{background:var(--info);box-shadow:0 0 15px var(--info)}
.toast-msg{flex:1;line-height:1.4;color:var(--text)}
.toast-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:0;line-height:1;display:flex;align-items:center}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(2,4,10,.85);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn 200ms}
.modal.show{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--primary);border-radius:var(--r-lg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,229,255,.3),var(--sh-lg);animation:modalIn 250ms cubic-bezier(.4,0,.2,1);position:relative}
.modal-box::before,.modal-box::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--primary);pointer-events:none;z-index:2}
.modal-box::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-top-left-radius:var(--r-lg)}
.modal-box::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-bottom-right-radius:var(--r-lg)}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;gap:12px}
.modal-head h2{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:800;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.04em}
.modal-head h2 .icon{color:var(--primary);filter:drop-shadow(0 0 8px rgba(0,229,255,.6))}
.modal-close{background:var(--surface-3);border:1px solid var(--border);width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.modal-close:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.modal-body{padding:24px}

/* CMD PALETTE */
.cmd-palette{position:fixed;inset:0;background:rgba(2,4,10,.85);backdrop-filter:blur(8px);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;animation:fadeIn 150ms}
.cmd-palette.show{display:flex}
.cmd-box{background:var(--surface);border:1px solid var(--primary);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:0 0 60px rgba(0,229,255,.3),var(--sh-lg);overflow:hidden;animation:modalIn 200ms}
.cmd-search{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.cmd-search .icon{color:var(--primary);filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
.cmd-search input{flex:1;border:none;background:transparent;font-size:14px;outline:none;color:var(--text);font-family:'Rajdhani',sans-serif;font-weight:600}
.cmd-search kbd{padding:3px 6px;background:var(--surface-3);border-radius:4px;font-size:10px;font-weight:700;color:var(--primary);border:1px solid var(--primary);font-family:'JetBrains Mono',monospace}
.cmd-results{max-height:400px;overflow-y:auto;padding:8px}
.cmd-group-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:8px 14px 4px;font-family:'Orbitron',sans-serif}
.cmd-item{padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;transition:all 100ms;color:var(--text);font-family:'Rajdhani',sans-serif}
.cmd-item .icon{color:var(--muted)}
.cmd-item:hover,.cmd-item.hl{background:var(--primary-soft);color:var(--primary);box-shadow:inset 0 0 10px rgba(0,229,255,.1)}
.cmd-item:hover .icon,.cmd-item.hl .icon{color:var(--primary)}
.cmd-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

/* SERVICE CARDS */
.svc-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:all var(--t);position:relative;user-select:none}
.svc-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 0 20px rgba(0,229,255,.3)}
.svc-card.selected{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 25px rgba(0,229,255,.4),inset 0 0 15px rgba(0,229,255,.1)}
.svc-card.selected::after{content:"";position:absolute;top:6px;right:6px;width:16px;height:16px;background:var(--primary);border-radius:50%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");background-size:11px;background-position:center;background-repeat:no-repeat;box-shadow:0 0 10px var(--primary)}
.svc-fav{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:5px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all var(--t);opacity:0;z-index:1}
.svc-card:hover .svc-fav,.svc-fav.active{opacity:1}
.svc-fav:hover,.svc-fav.active{color:var(--warning)}
.svc-fav.active .icon{fill:var(--warning);filter:drop-shadow(0 0 6px var(--warning))}
.svc-icon-wrap{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;position:relative;overflow:hidden;border:1px solid var(--border)}
.svc-name{font-size:11px;font-weight:700;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;font-family:'Rajdhani',sans-serif;letter-spacing:.02em;text-transform:uppercase}

/* BRAND ICON */
.brand-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.brand-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.brand-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px}

/* FLAGS */
.ctr-flag-wrap{display:inline-block;position:relative;flex-shrink:0;border-radius:4px;overflow:hidden;background:var(--surface-3);box-shadow:0 0 0 1px var(--border);vertical-align:middle}
.ctr-flag-wrap .ctr-flag-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ctr-flag-wrap .ctr-flag{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* BUY LAYOUT */
.buy-layout{display:grid;grid-template-columns:1fr 400px;gap:20px;align-items:start}
.buy-main{min-width:0}
.buy-sidebar{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:4px}
.buy-sidebar::-webkit-scrollbar{width:6px}
.buy-sidebar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
.sticky-card{margin-bottom:0!important;padding:18px!important}
.sidebar-empty{text-align:center;padding:32px 16px;color:var(--muted)}
.sidebar-empty .empty-icon{width:64px;height:64px;border-radius:16px}
.sidebar-empty .empty-title{font-size:13px;margin-bottom:6px}
.sidebar-empty .empty-desc{line-height:1.6}
.sidebar-svc-info{display:flex;align-items:center;gap:12px;padding:12px;background:var(--primary-soft);border-radius:8px;margin-bottom:14px;border:1px solid rgba(0,229,255,.3);box-shadow:0 0 20px rgba(0,229,255,.1)}
.quick-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quick-pick{padding:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;text-align:left;transition:all var(--t)}
.quick-pick:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px);box-shadow:0 0 15px rgba(0,229,255,.3)}
.qp-label{font-size:9px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;font-family:'Orbitron',sans-serif}
.qp-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rajdhani',sans-serif}
.qp-price{font-size:11px;font-weight:800;color:var(--success);margin-top:2px;font-family:'JetBrains Mono',monospace}
.sort-tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--surface-3);padding:3px;border-radius:8px;border:1px solid var(--border)}
.sort-tab{flex:1;padding:7px 6px;background:transparent;border:none;border-radius:5px;cursor:pointer;font-size:10px;font-weight:800;color:var(--text-2);transition:all var(--t);font-family:'Orbitron',sans-serif;letter-spacing:.04em;text-transform:uppercase}
.sort-tab.active{background:var(--primary);color:#000;box-shadow:0 0 15px rgba(0,229,255,.4)}
.country-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;padding-right:2px;margin-bottom:14px}
.country-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all var(--t)}
.country-item:hover{border-color:var(--primary);background:var(--primary-soft)}
.country-item.selected{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 20px rgba(0,229,255,.3),inset 0 0 10px rgba(0,229,255,.1)}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.ci-meta{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600}
.ci-price{font-size:12px;font-weight:800;color:var(--primary);text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace;text-shadow:0 0 8px rgba(0,229,255,.4)}
.confirm-box{padding:14px;background:var(--surface);border:1.5px solid var(--primary);border-radius:10px;margin-top:4px;box-shadow:0 0 25px rgba(0,229,255,.2)}
.cb-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12px;gap:10px}
.cb-row span{color:var(--text-2);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.05em;font-family:'Orbitron',sans-serif}
.cb-row b{font-weight:800;color:var(--text);font-family:'JetBrains Mono',monospace;text-align:right}
.qty-stepper{display:flex;align-items:center;gap:0;background:var(--surface-3);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.qty-stepper button{width:28px;height:28px;background:transparent;border:none;cursor:pointer;color:var(--text);font-size:16px;font-weight:800;transition:all var(--t)}
.qty-stepper button:hover{background:var(--primary);color:#000}
.qty-stepper input{width:40px;height:28px;text-align:center;border:none;background:var(--surface);font-weight:800;font-size:12px;outline:none;font-family:'JetBrains Mono',monospace}
.cb-total{display:flex;justify-content:space-between;align-items:center;padding:12px 0 10px;border-top:1.5px dashed var(--primary);margin-top:6px}
.cb-total span{font-weight:800;font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-family:'Orbitron',sans-serif}
.cb-total b{font-size:20px;font-weight:800;color:var(--primary);font-family:'JetBrains Mono',monospace;text-shadow:0 0 15px rgba(0,229,255,.5)}

/* MOBILE STICKY BAR */
.buy-bottom-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(15,21,36,.95);border-top:1px solid var(--primary);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 30px rgba(0,229,255,.3);z-index:800;gap:12px;align-items:center;animation:slideUp 300ms cubic-bezier(.4,0,.2,1);backdrop-filter:blur(20px)}
.buy-bottom-bar.show{display:flex}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bb-info{flex:1;min-width:0}
.bb-svc{font-size:13px;font-weight:800;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Orbitron',sans-serif;text-shadow:0 0 10px rgba(0,229,255,.4)}
.bb-sub{font-size:11px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bb-btn{flex-shrink:0}

/* MINI TRACKER */
.mini-tracker{position:fixed;bottom:20px;left:20px;width:280px;background:var(--surface);border:1px solid var(--primary);border-radius:12px;box-shadow:0 0 30px rgba(0,229,255,.3),var(--sh-lg);z-index:850;display:none;overflow:hidden;animation:slideUp 300ms cubic-bezier(.4,0,.2,1)}
.mini-tracker.show{display:block}
.mt-head{padding:10px 14px;background:var(--primary-grad);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.mt-chevron{transition:transform var(--t)}
.mini-tracker.expanded .mt-chevron{transform:rotate(180deg)}
.mt-body{max-height:0;overflow:hidden;transition:max-height 300ms cubic-bezier(.4,0,.2,1)}
.mini-tracker.expanded .mt-body{max-height:340px;overflow-y:auto}
.mt-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t)}
.mt-item:last-child{border-bottom:none}
.mt-item:hover{background:var(--primary-soft)}
.mt-num{font-size:12px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace}
.mt-otp{padding:4px 10px;background:var(--primary-grad);color:#000;border-radius:5px;font-weight:800;font-size:13px;letter-spacing:2px;font-family:'JetBrains Mono',monospace;margin-top:4px;display:inline-block;box-shadow:0 0 15px rgba(0,229,255,.4)}
.mt-timer{font-size:10px;color:var(--warning);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace}

/* CONFETTI */
.confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9998}

/* SEARCH */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);transition:all var(--t);font-family:'Rajdhani',sans-serif;font-weight:600}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,229,255,.15),0 0 15px rgba(0,229,255,.3)}
.search .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--primary);pointer-events:none;display:flex;filter:drop-shadow(0 0 4px rgba(0,229,255,.5))}

/* SECTION HEADING */
.section-heading{font-size:10px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;display:flex;align-items:center;gap:6px;font-family:'Orbitron',sans-serif}
.section-heading:first-child{margin-top:0}

/* OTP */
.otp-big{background:var(--primary-grad);color:#000;padding:18px;border-radius:10px;text-align:center;font-size:30px;font-weight:800;letter-spacing:8px;margin:12px 0;font-family:'JetBrains Mono',monospace;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,229,255,.5)}
.otp-big::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.1) 50%,transparent 50%,rgba(0,0,0,.1) 100%);background-size:100% 4px;animation:scan 2s linear infinite;pointer-events:none}
.num-display{background:var(--surface);border:2px dashed var(--primary);padding:14px;border-radius:10px;text-align:center;font-size:20px;font-weight:800;color:var(--primary);margin:12px 0;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-shadow:0 0 10px rgba(0,229,255,.5)}

/* DEPOSIT */
.dep-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.dep-form{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;height:fit-content}
.preset-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.preset{padding:11px 6px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;color:var(--text);transition:all var(--t);font-family:'Orbitron',sans-serif;letter-spacing:.03em}
.preset:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 15px rgba(0,229,255,.3)}
.preset.active{background:var(--primary-grad);color:#000;border-color:var(--primary);box-shadow:0 0 25px rgba(0,229,255,.5)}
.method-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding:2px}
.method{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all var(--t);display:flex;justify-content:space-between;align-items:center;gap:10px}
.method:hover{border-color:var(--primary);box-shadow:0 0 15px rgba(0,229,255,.2)}
.method.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 20px rgba(0,229,255,.3)}
.method-name{font-weight:800;font-size:13px;font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.method-meta{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.method-fee{font-size:10px;color:var(--success);font-weight:800;flex-shrink:0;padding:3px 8px;background:var(--success-soft);border-radius:5px;border:1px solid var(--success);font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.dep-result{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.dep-steps{display:flex;gap:4px;margin-bottom:18px}
.dep-step{flex:1;text-align:center;padding:8px 4px;font-size:10px;font-weight:800;color:var(--muted);border-radius:5px;background:var(--surface-3);transition:all var(--t);font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
.dep-step.done{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.dep-step.current{background:var(--primary);color:#000;box-shadow:0 0 15px rgba(0,229,255,.5)}
.qr-box{background:var(--surface);border:2px solid var(--primary);border-radius:12px;padding:18px;text-align:center;margin:14px 0;box-shadow:0 0 25px rgba(0,229,255,.3)}
.qr-box img{max-width:260px;width:100%;border-radius:8px;display:block;margin:0 auto}
.qr-ph{width:260px;height:260px;background:var(--surface-3);border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:20px;margin:0 auto;flex-direction:column;gap:10px}
.qr-label{font-size:10px;color:var(--primary);margin-top:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-family:'Orbitron',sans-serif}
.qr-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--warning-soft);color:var(--warning);border-radius:99px;font-size:10px;font-weight:800;margin-top:6px;border:1px solid var(--warning);font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.dep-total{font-size:26px;font-weight:800;text-align:center;color:var(--primary);font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;margin:4px 0 12px;text-shadow:0 0 15px rgba(0,229,255,.5)}
.pay-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px}
.pay-line:last-child{border-bottom:none}
.pay-line .lbl{color:var(--text-2);font-weight:700;flex-shrink:0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-family:'Orbitron',sans-serif}
.pay-line .val{font-weight:800;display:flex;align-items:center;gap:6px;text-align:right;min-width:0;word-break:break-all;justify-content:flex-end;font-family:'JetBrains Mono',monospace;font-size:12px}
.copy-btn{padding:4px 8px;background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary);border-radius:5px;font-size:10px;font-weight:800;cursor:pointer;transition:all var(--t);flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.copy-btn:hover{background:var(--primary);color:#000;box-shadow:0 0 15px rgba(0,229,255,.5)}
.copy-btn.copied{background:var(--success);color:#000;border-color:var(--success)}
.countdown{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--warning-soft);color:var(--warning);border-radius:8px;font-weight:800;font-size:13px;border:1px solid var(--warning);font-family:'JetBrains Mono',monospace}
.countdown.exp{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.countdown.success{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.dep-hint{background:var(--info-soft);border:1px solid rgba(0,229,255,.3);color:var(--info);border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:14px;display:flex;gap:10px;align-items:flex-start;font-weight:600}
.dep-hint .icon{flex-shrink:0;margin-top:1px}
.dep-hint strong{display:block;margin-bottom:3px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:11px}

/* NOTIF PANEL */
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:340px;background:var(--surface);border:1px solid var(--primary);border-radius:12px;box-shadow:0 0 30px rgba(0,229,255,.3),var(--sh-lg);display:none;z-index:60;max-height:420px;overflow:hidden;backdrop-filter:blur(20px)}
.notif-panel.show{display:block;animation:fadeIn 150ms}
.notif-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
.notif-list{max-height:360px;overflow-y:auto}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;font-weight:600}
.notif-item:last-child{border-bottom:none}
.notif-item .notif-icon{width:28px;height:28px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--primary);box-shadow:0 0 10px rgba(0,229,255,.3)}
.notif-item .notif-body{flex:1}
.notif-item b{color:var(--text);display:block;margin-bottom:2px;font-size:12px;font-weight:800}
.notif-item span{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace}
.notif-item.unread{background:var(--primary-soft)}

/* FAB */
.fab-container{position:fixed;bottom:24px;right:24px;z-index:900}
.fab{width:54px;height:54px;border-radius:14px;background:var(--primary-grad);color:#000;border:none;cursor:pointer;box-shadow:0 0 25px rgba(0,229,255,.6);display:flex;align-items:center;justify-content:center;transition:all 300ms cubic-bezier(.4,0,.2,1);transform-origin:center;position:relative;overflow:hidden}
.fab::before{content:"";position:absolute;inset:2px;border:1px solid rgba(0,0,0,.2);border-radius:12px;pointer-events:none}
.fab:hover{transform:scale(1.08);box-shadow:0 0 40px rgba(0,229,255,.8)}
.fab.open{transform:rotate(45deg)}
.fab-menu{position:absolute;bottom:70px;right:0;display:flex;flex-direction:column;gap:8px;pointer-events:none;opacity:0;transform:translateY(10px);transition:all 250ms}
.fab-container.open .fab-menu{pointer-events:auto;opacity:1;transform:translateY(0)}
.fab-item{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--surface);border:1px solid var(--primary);border-radius:99px;cursor:pointer;box-shadow:0 0 20px rgba(0,229,255,.3);font-size:12px;font-weight:800;white-space:nowrap;transition:all var(--t);flex-direction:row-reverse;color:var(--text);font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.fab-item:hover{background:var(--primary);color:#000;transform:translateX(-4px);box-shadow:0 0 30px rgba(0,229,255,.6)}
.fab-item .icon{color:var(--primary)}
.fab-item:hover .icon{color:#000}

/* TOUR */
.tour-overlay{position:fixed;inset:0;background:rgba(2,4,10,.85);z-index:4000;display:none}
.tour-overlay.show{display:block;animation:fadeIn 300ms}
.tour-spotlight{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(2,4,10,.85);transition:all 300ms;pointer-events:none;border:2px solid var(--primary);box-shadow:0 0 0 9999px rgba(2,4,10,.85),0 0 30px var(--primary)}
.tour-tip{position:absolute;background:var(--surface);border:1px solid var(--primary);border-radius:12px;padding:20px;max-width:340px;box-shadow:0 0 40px rgba(0,229,255,.4);animation:modalIn 300ms}
.tour-tip h3{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.tour-tip h3 .icon{color:var(--primary);filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
.tour-tip p{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:16px;font-weight:600}
.tour-tip-footer{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tour-progress{font-size:10px;color:var(--primary);font-weight:800;font-family:'Orbitron',sans-serif;letter-spacing:.05em}

/* DEBUG */
.debug-panel{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--primary);z-index:1500;max-height:50vh;display:none;box-shadow:0 -8px 40px rgba(0,229,255,.3);flex-direction:column}
.debug-panel.show{display:flex}
.debug-head{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);font-size:11px;font-weight:800;color:var(--primary);font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.debug-metrics{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.debug-metric{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:10px;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-family:'Orbitron',sans-serif}
.debug-metric b{color:var(--primary);font-family:'JetBrains Mono',monospace;font-size:13px;display:block;margin-top:2px}
.debug-logs{flex:1;overflow-y:auto;padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6}
.debug-log{padding:4px 0;border-bottom:1px dashed var(--border);display:flex;gap:10px;align-items:flex-start}
.debug-log .time{color:var(--muted);flex-shrink:0;width:70px}
.debug-log .method{font-weight:700;flex-shrink:0;width:50px;color:var(--primary)}
.debug-log .method.error{color:var(--danger)}
.debug-log .path{flex:1;word-break:break-all;color:var(--text)}
.debug-log .status{flex-shrink:0;font-weight:700}
.debug-log .status.ok{color:var(--success)}
.debug-log .status.err{color:var(--danger)}
.debug-log .latency{color:var(--muted);flex-shrink:0}

/* IDLE */
.idle-overlay{position:fixed;inset:0;background:rgba(2,4,10,.95);backdrop-filter:blur(12px);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px}
.idle-overlay.show{display:flex;animation:fadeIn 300ms}
.idle-box{background:var(--surface);border:1px solid var(--primary);border-radius:14px;padding:32px;text-align:center;max-width:400px;box-shadow:0 0 60px rgba(0,229,255,.4)}
.idle-box .idle-icon{display:inline-flex;width:64px;height:64px;border-radius:16px;background:var(--warning-soft);color:var(--warning);align-items:center;justify-content:center;margin-bottom:16px;border:1px solid var(--warning);box-shadow:0 0 25px rgba(255,179,0,.4)}
.idle-box h2{font-size:18px;margin-bottom:8px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.idle-box p{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.6;font-weight:600}

/* CHARTS */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-title{font-size:10px;font-weight:800;color:var(--primary);margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px;font-family:'Orbitron',sans-serif}
.chart-canvas{width:100%;height:80px;display:block}
.chart-value{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px;font-family:'Orbitron',sans-serif;text-shadow:0 0 10px rgba(0,229,255,.3)}
.chart-delta{font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.chart-delta.up{background:var(--success-soft);color:var(--success);border:1px solid var(--success)}

/* BULK */
.bulk-bar{position:sticky;bottom:16px;background:var(--primary-grad);color:#000;border-radius:10px;padding:12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 0 30px rgba(0,229,255,.5);z-index:100}
.bulk-bar.show{display:flex;animation:fadeIn 200ms}
.bulk-info{font-size:12px;font-weight:800;flex:1;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.bulk-bar .btn{background:rgba(0,0,0,.25);color:#000;border:1px solid rgba(0,0,0,.3)}
.bulk-bar .btn:hover{background:rgba(0,0,0,.4)}
.checkbox{width:18px;height:18px;cursor:pointer;accent-color:var(--primary)}

/* CHIPS */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;background:var(--surface-3);border:1px solid var(--border);border-radius:99px;font-size:10px;font-weight:800;cursor:pointer;color:var(--text-2);transition:all var(--t);display:inline-flex;align-items:center;gap:5px;font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.chip:hover{background:var(--border);color:var(--text)}
.chip.active{background:var(--primary);color:#000;border-color:var(--primary);box-shadow:0 0 15px rgba(0,229,255,.5)}

/* ORDER NOTE */
.order-note{background:var(--warning-soft);border:1px solid rgba(255,179,0,.3);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--text-2)}
.order-note textarea{width:100%;background:transparent;border:none;resize:vertical;min-height:40px;font-size:12px;color:var(--text);outline:none;font-family:'JetBrains Mono',monospace}
.order-note-label{font-size:10px;font-weight:800;color:var(--warning);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:4px;font-family:'Orbitron',sans-serif}

/* RESPONSIVE */
@media(max-width:900px){
  .buy-layout{grid-template-columns:1fr}
  .buy-sidebar{position:static;max-height:none}
  .dep-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .app{padding:10px;padding-bottom:76px}
  .topbar{padding:10px 12px;gap:8px;flex-wrap:nowrap}
  .brand-txt p{display:none}
  .brand-txt h1{font-size:13px}
  .brand-mark{width:36px;height:36px}
  .live-clock{display:none}
  .content{padding:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .grid-3,.grid-4{grid-template-columns:1fr 1fr}
  .svc-icon-wrap{width:36px;height:36px}
  .svc-name{font-size:10px}
  .otp-big{font-size:22px;letter-spacing:5px}
  .icon-btn{width:34px;height:34px}
  .balance-pill{font-size:11px;padding:6px 10px}
  .notif-panel{width:calc(100vw - 32px);right:-50px}
  .mini-tracker{left:8px;right:8px;width:auto;bottom:76px}
  .fab-container{bottom:80px}
  .qr-ph{width:100%;max-width:260px;aspect-ratio:1;height:auto}
  .card-title{font-size:11px}
}
</style>

function drawDonut(id, segments) { const canvas = $(id); if (!canvas) return; const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1; const size = canvas.clientWidth || 120; canvas.width = size * dpr; canvas.height = size * dpr; canvas.style.height = size + 'px'; ctx.scale(dpr, dpr); ctx.clearRect(0, 0, size, size); const total = segments.reduce((a, s) => a + s.value, 0) || 1; let angle = -Math.PI / 2; const cx = size / 2, cy = size / 2, r = size / 2 - 8, inner = r * 0.6; segments.forEach(seg => { const slice = (seg.value / total) * Math.PI * 2; ctx.beginPath(); ctx.arc(cx, cy, r, angle, angle + slice); ctx.arc(cx, cy, inner, angle + slice, angle, true); ctx.closePath(); ctx.fillStyle = seg.color; ctx.fill(); angle += slice; }); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim(); ctx.font = 'bold 18px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(total), cx, cy); }
function drawBars(id, data, color = '#00e5ff') { const canvas = $(id); if (!canvas) return; const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1; const w = canvas.clientWidth || 300, h = canvas.clientHeight || 80; canvas.width = w * dpr; canvas.height = h * dpr; ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h); if (!data.length) return; const max = Math.max(...data.map(d => d.value), 1); const barW = (w / data.length) * 0.7, gap = (w / data.length) * 0.3; data.forEach((d, i) => { const barH = (d.value / max) * (h - 20); const x = i * (barW + gap) + gap / 2, y = h - barH - 4; ctx.fillStyle = color + '30'; ctx.fillRect(x, 0, barW, h); ctx.fillStyle = color; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, barW, barH, 4); else ctx.rect(x, y, barW, barH); ctx.fill(); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim(); ctx.font = '9px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(d.label, x + barW / 2, h - 1); }); }

function renderServicesBySections(query) {

  if (query) list = servicesCache.map(s => ({ ...s, score: fuzzyScore(query, s.text) })).filter(s => s.score >= 0).sort((a, b) => b.score - a.score);
  if (!list.length) { box.innerHTML = `<div class="empty"><div class="empty-icon">${icon('search', 32)}</div><div class="empty-title">Tidak ditemukan</div></div>`; return; }
  let html = '';
  if (!query) {
    const favs = UserPrefs.getFavs(), recents = UserPrefs.getRecents();
    const favItems = favs.map(f => servicesCache.find(s => s.id === f.id)).filter(Boolean);
    const recentItems = recents.map(r => servicesCache.find(s => s.id === r.id)).filter(Boolean).filter(s => !favItems.some(f => f.id === s.id));

function pollOrder(uuid) {
  Poller.add('order:' + uuid, async () => {
    try {
      const r = await api.call(`/orders/${uuid}`);
      const o = r.data || {};
      const t = $('timer-' + uuid); if (t) t.textContent = (o.remaining_time || 0) + 's';
      MiniTracker.update(uuid, { remaining: o.remaining_time || 0 });
      if (o.latest_code) {
        Poller.remove('order:' + uuid);
        const box = $('otp-' + uuid);
        if (box) box.innerHTML = `<div class="otp-big" style="font-size:22px;padding:12px;letter-spacing:5px">${escapeHtml(o.latest_code)}</div><div style="color:var(--success);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;font-family:'Orbitron',sans-serif;text-transform:uppercase">${icon('checkCircle', 12)} Kode diterima</div>`;

        showOtpModal(o);
        Notif.push('OTP diterima', `${o.number} → ${o.latest_code}`);
        Sound.success(); Confetti.show(); vibrate([100, 50, 100]);
        autoCopyOTP(o.latest_code);

}

async function loadHistoryData() { try { const r = await api.call('/orders/history'); historyState.data = r.data || []; renderHistory(); } catch (e) { $('historyList').innerHTML = `<div class="empty"><div class="empty-title">Gagal memuat</div></div>`; } }
const onHistorySearch = debounce(v => { historyState.search = v; renderHistory(); }, 300);
function setHistoryFilter(f, el) { historyState.filter = f; qsa('#histChips .chip').forEach(c => c.classList.remove('active')); if (el) el.classList.add('active'); renderHistory(); }
function renderHistory() {
  let list = historyState.data;
  if (historyState.filter !== 'all') list = list.filter(o => o.status === historyState.filter);
  if (historyState.search) list = list.filter(o => fuzzyScore(historyState.search, o.number) >= 0 || fuzzyScore(historyState.search, (o.service && o.service.name) || '') >= 0);
  const { key, dir } = historyState.sort;
  list = [...list].sort((a, b) => { const av = a[key] ?? '', bv = b[key] ?? ''; return (av > bv ? 1 : av < bv ? -1 : 0) * (dir === 'asc' ? 1 : -1); });
  const th = (k, label) => `<th class="${historyState.sort.key === k ? 'sorted' : ''}" onclick="sortHistory('${k}')">${label}<span class="sort-arrow">${historyState.sort.key === k ? (historyState.sort.dir === 'asc' ? '▲' : '▼') : '⇅'}</span></th>`;
  $('historyList').innerHTML = list.length ? `<table><thead><tr>${th('number', 'Nomor')}${th('status', 'Status')}${th('price', 'Harga')}<th>SMS</th><th>Aksi</th></tr></thead><tbody>${list.map(o => `<tr><td><b style="font-family:'JetBrains Mono',monospace">${escapeHtml(o.number)}</b></td><td><span class="badge badge-${o.status === 'completed' ? 'success' : o.status === 'cancelled' ? 'danger' : 'warning'}">${escapeHtml(o.status)}</span></td><td style="font-family:'JetBrains Mono',monospace">${rp(o.price)}</td><td class="mono">${o.sms && o.sms.length ? escapeHtml(o.sms[o.sms.length - 1].code) : '-'}</td><td>${o.status === 'completed' ? `<button class="btn btn-warning btn-sm" onclick="requestRefund('${escAttr(o.order_uuid)}')">${icon('rotateCcw', 11)} Refund</button>` : '-'}</td></tr>`).join('')}</tbody></table>` : `<div class="empty"><div class="empty-icon">${icon('history', 32)}</div><div class="empty-title">Tidak ada riwayat</div></div>`;
}
function sortHistory(key) { if (historyState.sort.key === key) historyState.sort.dir = historyState.sort.dir === 'asc' ? 'desc' : 'asc'; else historyState.sort = { key, dir: 'asc' }; renderHistory(); }
function exportHistoryCSV() { const rows = historyState.data.map(o => ({ Nomor: o.number, Status: o.status, Harga: o.price, SMS: o.sms && o.sms.length ? o.sms[o.sms.length - 1].code : '', UUID: o.order_uuid })); exportCSV(rows, `zyanotps-history-${Date.now()}.csv`); }

function setPreset(v, el) { $('depAmt').value = v; qsa('.preset').forEach(p => p.classList.remove('active')); if (el) el.classList.add('active'); saveDepForm(); Sound.click(); }

function buildQr(d) { if (d.qr_code_base64) { let b = String(d.qr_code_base64).trim(); if (!b.startsWith('data:')) b = 'data:image/png;base64,' + b.replace(/^data:image\/[a-z]+;base64,/, ''); return `<img src="${b}" alt="QR">`; } if (d.qr_url) return `<img src="${escapeHtml(d.qr_url)}" alt="QR">`; if (d.qr_string) return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(d.qr_string)}" alt="QR">`; if (d.qr_code) { const s = String(d.qr_code); if (s.startsWith('http')) return `<img src="${escapeHtml(s)}" alt="QR">`; if (s.length > 50 && /^[A-Za-z0-9+/=]+$/.test(s)) return `<img src="data:image/png;base64,${s}" alt="QR">`; return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(s)}" alt="QR">`; } return null; }
function renderDeposit(d) { $('depPlaceholder').style.display = 'none'; const box = $('depResultBox'); box.style.display = 'block'; const total = d.total_amount || d.amount || 0, payCode = d.payment_code || d.va_number || d.payment_number || '', status = (d.status || 'pending').toLowerCase(), qr = buildQr(d); const bmap = { pending: ['badge-warning', 'PENDING'], success: ['badge-success', 'SUCCESS'], failed: ['badge-danger', 'FAILED'], expired: ['badge-danger', 'EXPIRED'] }; const pair = bmap[status] || ['badge-secondary', status.toUpperCase()]; box.innerHTML = `<div class="dep-result"><div class="dep-steps"><div class="dep-step done">1. Dibuat</div><div class="dep-step current" id="step2">2. Bayar</div><div class="dep-step" id="step3">3. Sukses</div></div><div class="card-title" style="margin-bottom:10px">${icon('creditCard', 16)} Instruksi <span class="badge ${pair[0]} spacer" id="depStatusBadge">${pair[1]}</span></div><div style="text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800;font-family:'Orbitron',sans-serif">Total</div><div class="dep-total" id="depTotal">${rp(total)}</div><button class="copy-btn" onclick="copy('${total}',this)">${icon('copy', 11)} Copy</button></div><div class="qr-box">${qr || `<div class="qr-ph">${icon('creditCard', 40, 1.5)}<div>${d.payment_url ? 'Buka link' : 'QR tidak tersedia'}</div></div>`}<div class="qr-label">Scan QRIS</div><div class="qr-badge">${icon('checkCircle', 10)} Semua e-wallet</div></div>${payCode ? `<div class="pay-line"><span class="lbl">Kode</span><span class="val">${escapeHtml(payCode)}<button class="copy-btn" onclick="copy('${escAttr(payCode)}',this)">${icon('copy', 10)}</button></span></div>` : ''}${d.uniqcode_tx ? `<div class="pay-line"><span class="lbl">TX</span><span class="val" style="font-size:10px">${escapeHtml(d.uniqcode_tx)}<button class="copy-btn" onclick="copy('${escAttr(d.uniqcode_tx)}',this)">${icon('copy', 10)}</button></span></div>` : ''}<div class="pay-line"><span class="lbl">Total</span><span class="val" style="color:var(--primary)">${rp(total)}</span></div>${d.payment_url ? `<div style="text-align:center;margin-top:12px"><a href="${escapeHtml(d.payment_url)}" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none">${icon('externalLink', 12)} Buka Halaman</a></div>` : ''}<div style="text-align:center;margin-top:14px"><div class="countdown" id="depCountdown">${icon('clock', 12)} --:--</div></div><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="checkDepStatus()">${icon('refresh', 12)} Cek</button><button class="btn btn-danger btn-sm" onclick="resetDep()">${icon('x', 12)}</button></div><div class="dep-hint">${icon('alertTriangle', 14)}<div><strong>Penting</strong>Transfer persis nominal agar sistem mendeteksi otomatis.</div></div></div>`; startDepTimer(d); startDepPoll(d); }
function startDepTimer(d) { clearInterval(depTimer); const el = $('depCountdown'); if (!el) return; let exp = 0; const iso = d.expires_at_iso || d.expires_at; if (iso) { const p = Date.parse(iso.replace(' ', 'T')); if (!isNaN(p)) exp = p; } if (!exp && d.expiration_time) exp = Date.now() + parseInt(d.expiration_time) * 60000; if (!exp && d.expires_in_seconds) exp = Date.now() + parseInt(d.expires_in_seconds) * 1000; if (!exp) { el.innerHTML = icon('clock', 12) + ' Tanpa batas'; return; } const tick = () => { const diff = exp - Date.now(); if (diff <= 0) { el.innerHTML = icon('xCircle', 12) + ' Expired'; el.classList.add('exp'); clearInterval(depTimer); return; } const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000); el.innerHTML = icon('clock', 12) + ` ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; el.classList.toggle('exp', diff < 5 * 60000); }; tick(); depTimer = setInterval(tick, 1000); }
function startDepPoll(d) { if (!d.uniqcode_tx) return; Poller.remove('deposit'); Poller.add('deposit', async () => { try { const r = await api.call(`/transactions/${d.uniqcode_tx}`); const st = (r.data?.status || '').toLowerCase(); if (st === 'success') { Poller.remove('deposit'); clearInterval(depTimer); const cd = $('depCountdown'); if (cd) { cd.innerHTML = icon('checkCircle', 12) + ' Diterima'; cd.classList.add('success'); cd.classList.remove('exp'); } const bg = $('depStatusBadge'); if (bg) { bg.className = 'badge badge-success spacer'; bg.textContent = 'SUCCESS'; } const s2 = $('step2'); if (s2) { s2.classList.add('done'); s2.classList.remove('current'); } const s3 = $('step3'); if (s3) s3.classList.add('done'); Sound.success(); Confetti.show(); Notif.push('Deposit berhasil', '+ ' + rp(d.total_amount || d.amount)); Toast.show('Deposit sukses!', { type: 'success', duration: 6000 }); notifyDesktop('Deposit Berhasil', '+ ' + rp(d.total_amount || d.amount)); loadBalance(); loadTx(); } else if (st === 'failed' || st === 'expired') { Poller.remove('deposit'); clearInterval(depTimer); Sound.error(); Toast.show(st, { type: 'error' }); } } catch (e) {} }, 8000); }
async function checkDepStatus() { if (!depState || !depState.uniqcode_tx) return Toast.show('Tidak ada aktif', { type: 'warning' }); try { const r = await api.call(`/transactions/${depState.uniqcode_tx}`); const st = r.data?.status; if (st === 'success') { Toast.show('Sudah dibayar', { type: 'success' }); loadBalance(); loadTx(); } else Toast.show('Status: ' + st, { type: 'info' }); } catch (e) { Toast.show(e.message, { type: 'error' }); } }

const Keys = { buffer: '', timer: null, init() { document.addEventListener('keydown', e => { if (e.target.matches('input,textarea,select')) return; if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'd') { e.preventDefault(); Debug.toggle(); return; } if (e.ctrlKey || e.metaKey) return; const k = e.key.toLowerCase(); if (k === '?') { e.preventDefault(); Help.open(); return; } if (k === 'g') { this.buffer = 'g'; clearTimeout(this.timer); this.timer = setTimeout(() => this.buffer = '', 800); return; } if (this.buffer === 'g') { const routes = { d: 'dashboard', b: 'buyNumber', a: 'activeOrders', h: 'history', p: 'deposit' }; if (routes[k]) { e.preventDefault(); Router.go(routes[k]); this.buffer = ''; } } }); } };
